version: '3.8'

services:
  taskqueue-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskqueue-mcp
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MODE=${MODE:-rest}
      - PORT=${PORT:-9593}
      - ENDPOINT=${ENDPOINT:-/rest}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - TASKQUEUE_STORAGE_MODE=${TASKQUEUE_STORAGE_MODE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    expose:
      - 9593
    ports:
      - "9593:9593"
    depends_on:
      - redis
    networks:
      - mcp-network

  redis:
    image: redis:alpine
    container_name: taskqueue-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ../files/redis-data:/data
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  redis-data:
    driver: local 