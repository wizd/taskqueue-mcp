version: '3.8'

services:
  taskqueue-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MODE=${MODE:-rest}
      - PORT=${PORT:-9093}
      - ENDPOINT=${ENDPOINT:-/rest}
      - REDIS_HOST=${REDIS_HOST:-redis_tq_mcp}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - TASKQUEUE_STORAGE_MODE=${TASKQUEUE_STORAGE_MODE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_KEY=${API_KEY}
      - BULL_BOARD_ENABLED=${BULL_BOARD_ENABLED:-false}
      - BULL_BOARD_PORT=${BULL_BOARD_PORT:-3000}
      - BULL_BOARD_BASE_PATH=${BULL_BOARD_BASE_PATH:-/bull-board}
      - XAI_API_KEY=${XAI_API_KEY}
    expose:
      - ${PORT:-9093}
      - ${BULL_BOARD_PORT:-9094}
    ports:
      - ${PORT:-9093}:${PORT:-9093}
      - ${BULL_BOARD_PORT:-9094}:9094
    depends_on:
      - redis_tq_mcp
    networks:
      - dokploy-network

  redis_tq_mcp:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --port ${REDIS_PORT:-6379} --appendonly yes --maxmemory-policy noeviction
    volumes:
      - ../files/redis-data:/data
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  redis-data:
    driver: local 